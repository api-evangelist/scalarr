roadmap:
  published: true
  url: https://github.com/agent-defense/parallax#-roadmap
  detail: >-
    A written roadmap ships in the Parallax README in four themes — multi-framework
    and multi-provider support (LangChain, CrewAI, OpenAI Agents SDK, an
    OpenAI-compatible /v1/chat/completions proxy mode, configurable upstream),
    advanced evaluators (embedding-based semantic prompt-injection detection, tool
    argument JSON Schema validation, multi-turn escalation detection, token budget
    enforcement), extended lifecycle stages (response.after, memory.before, RAG
    retrieval.before/after, rule hot-reload), and SDKs/ecosystem (a Python client
    parallax-client, a TypeScript client @parallax/client, Slack/PagerDuty/SIEM
    webhook connectors, a dashboard UI). None of these exists today. The AI
    EdgeLabs Compliance Center page separately names HIPAA, ISO/IEC 62443, PCI DSS
    and NIST as roadmap frameworks beyond the shipped NIS2 and CRA mappings.

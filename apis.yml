name: Scalarr
description: >-
  Scalarr Inc. is a cybersecurity company that now operates primarily as AI
  EdgeLabs (edgelabs.ai), an AI-native runtime detection and response platform for
  workloads, containers, GPU environments, AI agents and edge infrastructure, with
  local inference, zero data egress, and out-of-the-box NIS2 and Cyber Resilience
  Act control mapping in its Compliance Center. It publishes Parallax, an
  Apache-2.0 runtime security engine for AI agents written in Rust, which ships as
  a single binary exposing a two-endpoint HTTP evaluation API (POST /evaluate,
  GET /health) plus a proxy mode that sits between an agent and the LLM API, 54
  curated rules across five evaluator engines, and first-party integrations for
  OpenClaw, Claude Code and the Codex CLI. Scalarr's original business - the
  machine-learning mobile ad-fraud Protection Suite and DeepView on scalarr.io -
  appears dormant: the site is still served but its content and sitemap have not
  been updated since 2022-2023 and api.scalarr.io answers every path with a
  default OpenResty 404. Scalarr is a portfolio company of Speedinvest. The hosted
  AI EdgeLabs platform API at portal.edgelabs.ai/api/ is real but undocumented and
  authentication-gated; no OpenAPI, AsyncAPI, GraphQL schema or MCP server is
  published for any surface.

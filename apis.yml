- name: AI EdgeLabs Portal API
  description: >-
    The HTTP API behind the AI EdgeLabs customer console at portal.edgelabs.ai.
    Confirmed live on 2026-08-13 - every path under /api/ answered HTTP 401 with a
    structured JSON envelope {"message","status","errorCode","title"} - but it is
    entirely undocumented: no reference page, no OpenAPI, no published
    authentication model, and no anonymous OAuth or OpenID discovery document.
    Console sign-in federates through Google and GitHub OAuth. Recorded here as a
    measured, authentication-gated surface, not as a documented developer API.
  humanURL: https://portal.edgelabs.ai
  baseURL: https://portal.edgelabs.ai/api/

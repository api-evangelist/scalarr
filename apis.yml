apis:
- name: Parallax Evaluation API
  description: >-
    Self-hosted HTTP API of Parallax, the Apache-2.0 runtime security engine
    Scalarr publishes for AI agents. Two endpoints: POST /evaluate takes a
    lifecycle event (message.before, tool.before, tool.after, params.before) with
    optional tool_name, tool_args, tool_result, message_text, model and params,
    runs it through a cost-ordered chain of regex, keyword-pattern, Sigma, CEL and
    SQL evaluators, and returns a decision (block, redact, detect or allow) with
    the reasons that matched and the elapsed evaluation time; GET /health returns
    status, mode, evaluator count and version. A proxy mode fronts the Anthropic
    Messages API and evaluates traffic transparently. The server ships with no
    authentication and binds to 127.0.0.1:9920 by default.
  humanURL: https://github.com/agent-defense/parallax
  baseURL: http://{host}:{port}
